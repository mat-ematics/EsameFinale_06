<!-- features/auth/login/login.component.html -->
<main class="d-flex justify-content-center align-items-center min-vh-100 py-5 px-3 px-sm-5">
  <form [formGroup]="form" (ngSubmit)="submit()" id="formLogin" class="bg-dark p-4 p-sm-5 rounded" novalidate>

    <h3 class="text-center mb-4">Sign In</h3>

    <!-- Username -->
    <div class="mb-3">
      <label class="form-label" for="inputUsername">Username</label>
      <input type="text" formControlName="username" id="inputUsername" class="form-control"
             placeholder="Your username" autocomplete="username"
             [ngClass]="cls('username')" (blur)="onBlur('username')">
      <div class="invalid-feedback" [class.is-shown]="isInvalid('username')">{{ error('username') }}</div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label class="form-label" for="inputPassword">Password</label>
      <input type="password" formControlName="password" id="inputPassword" class="form-control"
             placeholder="Your password" autocomplete="current-password"
             [ngClass]="cls('password')" (blur)="onBlur('password')">
      <div class="invalid-feedback" [class.is-shown]="isInvalid('password')">{{ error('password') }}</div>
    </div>

    <!-- Server error: deliberately generic for wrong user or password -->
    @if (formError()) {
      <div class="alert alert-danger" role="alert">{{ formError() }}</div>
    }

    <div class="d-flex justify-content-center">
      <button class="btn btn-danger w-50" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign In' }}
      </button>
    </div>

    <p class="text-center text-muted mt-4 mb-0">
      New here? <a routerLink="/register" class="color-brand">Create an account</a>
    </p>
  </form>
</main>
