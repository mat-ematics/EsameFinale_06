@if (visible()) {
  <section class="container-fluid px-4 mb-4" [attr.aria-label]="label()">
    <app-media-crumbs [crumbs]="crumbs()" [add]="add()" />

    @if (items().length) {
      <div class="carousel">
        <div #viewport class="viewport" (scroll)="update()">
          <ul #track class="track list-unstyled m-0 p-0">
            @for (item of items(); track key(item); let i = $index) {
                <li class="cell"><app-media-card [item]="item" [priority]="i < priorityCount()" /></li>
            }
          </ul>
        </div>

        @if (scrollable()) {
          <button type="button" class="arrow prev" aria-label="Scroll left" [disabled]="atStart()" (click)="scrollBy(-1)">
            <i class="bi bi-chevron-left"></i>
          </button>
          <button type="button" class="arrow next" aria-label="Scroll right" [disabled]="atEnd()" (click)="scrollBy(1)">
            <i class="bi bi-chevron-right"></i>
          </button>
        }
      </div>
    } @else {
      <p class="text-muted small mb-0">Nothing here yet.</p>
    }
  </section>
}
