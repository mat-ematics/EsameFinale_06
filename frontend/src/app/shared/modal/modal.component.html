<dialog #dialog [attr.aria-labelledby]="titleId"
        (cancel)="onCancel($event)" (close)="onNativeClose()"
        (mousedown)="onMouseDown($event)" (click)="onClick($event)">
  <div class="panel">
    <header class="d-flex justify-content-between align-items-center mb-3 inherit-bg">
      <h2 class="h5 mb-0" [id]="titleId">{{ title() }}</h2>
      <button type="button" class="btn-close" aria-label="Close" [disabled]="!dismissible()" (click)="request()"></button>
    </header>
    <ng-content />
  </div>
</dialog>
